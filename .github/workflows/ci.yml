name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"

# The app is Windows-only (Win32 APIs, Credential Manager), so build where it runs.
jobs:
  check:
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Frontend tests
        run: pnpm test

      # Type-checks and builds `dist`, which the Tauri build script expects to exist.
      - name: Frontend build
        run: pnpm build

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Warnings are reported, not fatal: the code base predates the check.
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets

      - name: Rustfmt
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked

  # Known vulnerabilities in Cargo.lock. Unmaintained or yanked crates only warn;
  # a vulnerability fails the job. Also weekly, since advisories appear without commits.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: cargo audit
        working-directory: src-tauri
        run: cargo audit
