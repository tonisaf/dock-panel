name: CI

on:
  push:
    branches: [main]
  pull_request:

# The app is Windows-only (Win32 APIs, Credential Manager), so build where it runs.
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Frontend tests
        run: pnpm test

      # Type-checks and builds `dist`, which the Tauri build script expects to exist.
      - name: Frontend build
        run: pnpm build

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked
