<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b8cff"/>
      <stop offset="0.55" stop-color="#7a5cff"/>
      <stop offset="1" stop-color="#c35cff"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.78"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1a0b4d" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#bg)"/>
  <!-- Slide-out panel docked to the left -->
  <rect x="176" y="176" width="376" height="672" rx="72" fill="url(#glass)" filter="url(#shadow)"/>
  <!-- Search bar -->
  <rect x="224" y="228" width="280" height="52" rx="26" fill="#7a5cff" opacity="0.22"/>
  <!-- App tiles -->
  <rect x="224" y="316" width="120" height="120" rx="32" fill="#5b8cff"/>
  <rect x="384" y="316" width="120" height="120" rx="32" fill="#c35cff"/>
  <rect x="224" y="472" width="120" height="120" rx="32" fill="#7a5cff"/>
  <rect x="384" y="472" width="120" height="120" rx="32" fill="#5bd0ff"/>
  <!-- Widget card -->
  <rect x="224" y="628" width="280" height="168" rx="36" fill="#7a5cff" opacity="0.2"/>
  <rect x="256" y="668" width="150" height="22" rx="11" fill="#7a5cff" opacity="0.55"/>
  <rect x="256" y="712" width="210" height="22" rx="11" fill="#7a5cff" opacity="0.35"/>
  <!-- Motion hint -->
  <rect x="620" y="420" width="220" height="44" rx="22" fill="#ffffff" opacity="0.55"/>
  <rect x="660" y="500" width="180" height="44" rx="22" fill="#ffffff" opacity="0.35"/>
  <rect x="700" y="580" width="140" height="44" rx="22" fill="#ffffff" opacity="0.2"/>
</svg>
